events {}
http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream frontend { zone frontend 64k; server frontend:3000 resolve; }
  upstream backend { zone backend 64k; server backend:8000 resolve; }
  upstream bot { zone bot 64k; server bot:8001 resolve; }
  server {
    listen 80;
    client_max_body_size 6m;
    location /telegram/webhook { proxy_pass http://bot; proxy_set_header Host $host; }
    location /v1/ { proxy_pass http://backend; proxy_set_header Host $host; }
    location /docs { proxy_pass http://backend; }
    location /openapi.json { proxy_pass http://backend; }
    location /health/ { proxy_pass http://backend; }
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
    }
  }
}
