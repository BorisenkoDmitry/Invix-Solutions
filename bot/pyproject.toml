[project]
name = "minimal-shop-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["aiogram>=3.20,<4", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
                "psycopg[binary,pool]>=3.2,<4", "httpx>=0.28,<1", "pydantic-settings>=2.7,<3"]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
