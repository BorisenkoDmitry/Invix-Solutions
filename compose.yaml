name: minimal-shop
x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-shop}:${POSTGRES_PASSWORD:-local-postgres-change-me}@postgres:5432/${POSTGRES_DB:-shop}
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-local-minio-change-me}
  ADMIN_API_KEY: ${ADMIN_API_KEY:-local-admin-change-me}
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shop}
      POSTGRES_USER: ${POSTGRES_USER:-shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-change-me}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  minio:
    build: ./infra/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-change-me}
    volumes: [minio-data:/data]
    ports: ["127.0.0.1:9001:9001"]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  migrate:
    build: ./backend
    environment: *backend-env
    command: /app/.venv/bin/python -m app.migrate
    depends_on:
      postgres: {condition: service_healthy}
  seed:
    build: ./backend
    environment: *backend-env
    command: /app/.venv/bin/python -m app.seed
    depends_on:
      migrate: {condition: service_completed_successfully}
      minio: {condition: service_healthy}
  backend:
    build: ./backend
    environment: *backend-env
    read_only: true
    depends_on:
      seed: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NEXT_TELEMETRY_DISABLED: "1"
    read_only: true
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  bot:
    profiles: [telegram]
    build: ./bot
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shop}:${POSTGRES_PASSWORD:-local-postgres-change-me}@postgres:5432/${POSTGRES_DB:-shop}
      BOT_TOKEN: ${BOT_TOKEN:-}
      BOT_WEBHOOK_SECRET: ${BOT_WEBHOOK_SECRET:-local-webhook-change-me}
      BOT_WEBHOOK_URL: ${BOT_WEBHOOK_URL:-}
      SHOP_URL: ${SHOP_URL:-http://localhost:8088}
    read_only: true
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  gateway:
    image: nginx:1.28-alpine
    ports: ["${SHOP_BIND_IP:-127.0.0.1}:${SHOP_PORT:-8088}:80"]
    volumes: [./infra/nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on:
      frontend: {condition: service_healthy}
    restart: unless-stopped
  tests:
    profiles: [test]
    build:
      context: ./backend
      target: tests
    environment:
      <<: *backend-env
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-shop}:${POSTGRES_PASSWORD:-local-postgres-change-me}@postgres:5432/${POSTGRES_DB:-shop}
      TEST_MINIO: "1"
    read_only: true
    depends_on:
      seed: {condition: service_completed_successfully}
  bot-tests:
    profiles: [test]
    build:
      context: ./bot
      target: tests
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shop}:${POSTGRES_PASSWORD:-local-postgres-change-me}@postgres:5432/${POSTGRES_DB:-shop}
      RUN_DB_TESTS: "1"
    read_only: true
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  postgres-data:
  minio-data:
